<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="記帳">
  <meta name="theme-color" id="theme-color-meta" content="#f7f3ee">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <title>記帳</title>
  <style>
/* ══════════════════════════════════════════
   THEMES — 四季配色（日本傳統色）
   春 / 夏 / 秋 / 冬 × light & dark
══════════════════════════════════════════ */

/* 春 — 薄桜 × 若草 (light) */
[data-theme="spring"] {
  --bg:          #f7f3ee;
  --surface:     #fdfaf6;
  --surface2:    #f0ebe3;
  --border:      #e2d9ce;
  --border-soft: #ede7de;
  --accent:      #b5787a;
  --accent-dim:  #f0e0e0;
  --income:      #5a8a6a;
  --expense:     #b5787a;
  --text:        #2c2420;
  --text-muted:  #9a8880;
  --text-light:  #c4b8b0;
  --nav-bg:      #fdfaf6;
  --header-bg:   #fdfaf6;
  color-scheme: light;
}

/* 春夜 — 夜桜（よざくら）
   深墨藍底，桜粉 accent，淡金點綴。
   想像隅田川夜桜 — 暗夜裡透出的朦朧粉光。 */
[data-theme="spring-dark"] {
  --bg:          #0e0f18;   /* 夜藍黑，帶靛 */
  --surface:     #161824;
  --surface2:    #1e2030;
  --border:      #2a2c40;
  --border-soft: #242638;
  --accent:      #d4899a;   /* 夜桜粉，比日間更飽和 */
  --accent-dim:  #2a1a20;
  --income:      #7ab88a;   /* 若葉，月光下的緑 */
  --expense:     #d4899a;
  --text:        #f0e8f0;   /* 帶粉的月白 */
  --text-muted:  #8878a0;   /* 藤色（藤紫）muted */
  --text-light:  #706888;
  --nav-bg:      #0e0f18;
  --header-bg:   #0e0f18;
  color-scheme: dark;
}

/* 夏 — 白藍 × 瑠璃（日間，更清亮對比） */
[data-theme="summer"] {
  --bg:          #e8f2fa;   /* 水色底，比之前更藍 */
  --surface:     #f4faff;
  --surface2:    #d8eaf6;
  --border:      #b8d4ea;
  --border-soft: #c8dcee;
  --accent:      #2a6898;   /* 濃瑠璃，更深更鮮明 */
  --accent-dim:  #cce4f5;
  --income:      #3a8870;   /* 緑青 rokusho */
  --expense:     #8a4060;   /* 蘇芳紫 */
  --text:        #101e30;
  --text-muted:  #5870a0;
  --text-light:  #98b0cc;
  --nav-bg:      #f4faff;
  --header-bg:   #f4faff;
  color-scheme: light;
}

/* 夏夜 — 花火（はなび）
   深藍靛底，金赤 accent，玉色點綴。
   復古祭典感 — 濃靛色夜空炸開的金紅花火。 */
[data-theme="summer-dark"] {
  --bg:          #080c18;   /* 夏夜靛黑 */
  --surface:     #0e1428;
  --surface2:    #161e38;
  --border:      #222a48;
  --border-soft: #1c2440;
  --accent:      #e8602a;   /* 金赤 kinaka — 花火紅橙 */
  --accent-dim:  #2a1008;
  --income:      #48c8a8;   /* 玉色 tama-iro — 跳色青碧 */
  --expense:     #e8602a;
  --text:        #f0e8c8;   /* 和紙白帶黃，復古感 */
  --text-muted:  #8898c8;   /* 藍白 aijiro */
  --text-light:  #586090;
  --nav-bg:      #080c18;
  --header-bg:   #080c18;
  color-scheme: dark;
}

/* 秋 — 錆色 × 煤竹（日間） */
[data-theme="autumn"] {
  --bg:          #e8e0d0;
  --surface:     #f2ebe0;
  --surface2:    #d8cebb;
  --border:      #c4b8a0;
  --border-soft: #d0c4ad;
  --accent:      #8b4513;
  --accent-dim:  #e8d5c4;
  --income:      #4a7a48;
  --expense:     #8b4513;
  --text:        #1e1608;
  --text-muted:  #7a6848;
  --text-light:  #b8a888;
  --nav-bg:      #f2ebe0;
  --header-bg:   #f2ebe0;
  color-scheme: light;
}

/* 秋夜 — 月見（つきみ）
   極深煤色底，月白 accent，錆金琥珀點綴。
   想像縁側に坐って望月 — 煤色的夜、銀月、金色的燈。 */
[data-theme="autumn-dark"] {
  --bg:          #0a0804;   /* 煤黑，極深 */
  --surface:     #120e08;
  --surface2:    #1e1810;
  --border:      #302818;
  --border-soft: #281e10;
  --accent:      #e8c870;   /* 月白（帶金） kinjiro */
  --accent-dim:  #201808;
  --income:      #80b868;   /* 萌黄 moegi — 月光下的青緑 */
  --expense:     #c87040;   /* 錆金 — 橙琥珀 */
  --text:        #f8f0d8;   /* 象牙月白 */
  --text-muted:  #a09060;   /* 枯草色 kareyuki */
  --text-light:  #706040;
  --nav-bg:      #0a0804;
  --header-bg:   #0a0804;
  color-scheme: dark;
}

/* 冬 — 雪白 × 氷藍（日間，更清冽對比） */
[data-theme="winter"] {
  --bg:          #e4eaf4;   /* 比之前更冷更深的藍灰 */
  --surface:     #f0f4fc;
  --surface2:    #d4dcea;
  --border:      #b8c4d8;
  --border-soft: #c8d2e4;
  --accent:      #304870;   /* 紺色 kon — 深藍，比之前重很多 */
  --accent-dim:  #ccd4e8;
  --income:      #3a7870;   /* 深緑青 */
  --expense:     #784860;   /* 深紅鼠 */
  --text:        #101828;   /* 深夜藍黑 */
  --text-muted:  #607090;
  --text-light:  #9aa8c0;
  --nav-bg:      #f0f4fc;
  --header-bg:   #f0f4fc;
  color-scheme: light;
}

/* 冬夜 — 雪夜（ゆきよ）
   極深夜藍底，銀白 accent，氷青冷光。
   雪夜的靜謐 — 深藍黑的夜、雪反射的白光、結冰的青。 */
[data-theme="winter-dark"] {
  --bg:          #060810;   /* 極夜，幾乎純黑帶藍 */
  --surface:     #0c1020;
  --surface2:    #141828;
  --border:      #202438;
  --border-soft: #1a2030;
  --accent:      #c0d8f8;   /* 雪白帶冰藍 — 明亮跳色 */
  --accent-dim:  #101828;
  --income:      #60c8b8;   /* 氷青 koori — 明亮冰色 */
  --expense:     #b068a0;   /* 紫苑 shion — 冬の花 */
  --text:        #e8f0ff;   /* 極冷的藍白 */
  --text-muted:  #6070a0;   /* 藍鼠 */
  --text-light:  #485888;
  --nav-bg:      #060810;
  --header-bg:   #060810;
  color-scheme: dark;
}

/* ══ Per-season text tinting ══ */

/* 春 日 — 薄桜粉標題 */
[data-theme="spring"] .header h1      { color: #8b5a60; }
[data-theme="spring"] .month-label    { color: #a08888; }
[data-theme="spring"] .balance-label  { letter-spacing: .14em; }

/* 春夜 — 夜桜：藤紫標題，粉月份 */
[data-theme="spring-dark"] .header h1     { color: #d4899a; }
[data-theme="spring-dark"] .month-label   { color: #9888b8; }
[data-theme="spring-dark"] .tx-date-text  { color: #8878a8; }
[data-theme="spring-dark"] .balance-label { color: #a090b8; letter-spacing: .12em; }

/* 夏 日 — 濃瑠璃標題 */
[data-theme="summer"] .header h1      { color: #1a5080; }
[data-theme="summer"] .month-label    { color: #3868a0; }
[data-theme="summer"] .tx-date-text   { color: #3870a8; }

/* 夏夜 — 花火：金赤標題，玉色月份 */
[data-theme="summer-dark"] .header h1     { color: #e8602a; }
[data-theme="summer-dark"] .month-label   { color: #48c8a8; }
[data-theme="summer-dark"] .tx-date-text  { color: #c87840; }
[data-theme="summer-dark"] .balance-label { color: #a8b0d8; }

/* 秋 日 — 錆色標題 */
[data-theme="autumn"] .header h1          { color: #6a3010; }
[data-theme="autumn"] .month-label        { color: #9a6840; }
[data-theme="autumn"] .tx-date-text       { color: #8a5830; }
[data-theme="autumn"] .balance-label      { color: #9a7850; letter-spacing: .12em; }
[data-theme="autumn"] .list-section-label { color: #a07848; }

/* 秋夜 — 月見：月金標題，枯草月份 */
[data-theme="autumn-dark"] .header h1          { color: #e8c870; }
[data-theme="autumn-dark"] .month-label        { color: #b09050; }
[data-theme="autumn-dark"] .tx-date-text       { color: #c0a050; }
[data-theme="autumn-dark"] .balance-label      { color: #a09060; }
[data-theme="autumn-dark"] .list-section-label { color: #b09850; }

/* 冬 日 — 紺色標題 */
[data-theme="winter"] .header h1      { color: #203860; }
[data-theme="winter"] .month-label    { color: #405880; }
[data-theme="winter"] .tx-date-text   { color: #405890; }

/* 冬夜 — 雪夜：氷白標題，藍鼠月份 */
[data-theme="winter-dark"] .header h1     { color: #c0d8f8; }
[data-theme="winter-dark"] .month-label   { color: #6070a8; }
[data-theme="winter-dark"] .tx-date-text  { color: #5870a0; }
[data-theme="winter-dark"] .balance-label { color: #7080b0; }

/* ══ Base ══ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', 'Noto Serif TC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ── Number font ── */
.num {
  font-family: 'DM Mono', 'SF Mono', monospace;
  letter-spacing: -0.02em;
}

/* ── Views ── */
.view { display: none; flex-direction: column; min-height: 100dvh; }
.view.active { display: flex; }

/* ══ HEADER ══ */
.header {
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 14px;
  background: var(--header-bg);
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--border-soft);
}
.header-row { display: flex; align-items: center; justify-content: space-between; }
.header h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.05rem; font-weight: 500;
  letter-spacing: 0.06em; color: var(--text);
}
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button {
  background: none; border: none; color: var(--text-muted);
  font-size: 1rem; cursor: pointer; padding: 6px 10px;
  border-radius: 6px; transition: background .12s;
  font-family: 'Inter', sans-serif;
}
.month-nav button:active { background: var(--surface2); }
.month-label {
  font-family: 'DM Mono', monospace;
  font-size: .85rem; font-weight: 400;
  color: var(--text-muted); min-width: 72px; text-align: center;
  letter-spacing: 0.04em;
}

/* ══ SUMMARY CARD ══ */
.summary {
  margin: 16px 16px 12px;
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 22px 20px 18px;
}
.balance-label {
  font-family: 'Inter', sans-serif;
  font-size: .68rem; font-weight: 400;
  color: var(--text-muted); letter-spacing: .1em;
  text-transform: uppercase; margin-bottom: 6px;
}
.balance-amount {
  font-family: 'Noto Serif TC', serif;
  font-size: 2.2rem; font-weight: 300; letter-spacing: -0.02em;
  line-height: 1;
}
.balance-amount .num { font-family: 'DM Mono', monospace; font-weight: 300; }
.balance-amount.positive { color: var(--income); }
.balance-amount.negative { color: var(--expense); }
.balance-amount.zero     { color: var(--text-muted); }

.summary-row { display: flex; gap: 10px; margin-top: 18px; }
.summary-item {
  flex: 1; background: var(--surface2);
  border-radius: 10px; padding: 12px 14px;
  border: 1px solid var(--border-soft);
}
.summary-item .s-label {
  font-family: 'Inter', sans-serif;
  font-size: .65rem; color: var(--text-muted);
  letter-spacing: .06em; margin-bottom: 5px;
}
.summary-item .s-amount {
  font-family: 'DM Mono', monospace;
  font-size: .98rem; font-weight: 400; letter-spacing: -0.01em;
}
.summary-item .s-amount.income  { color: var(--income); }
.summary-item .s-amount.expense { color: var(--expense); }

/* ══ BUDGET BAR ══ */
.budget-section { margin: 0 16px 14px; }
.budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.budget-title {
  font-family: 'Inter', sans-serif;
  font-size: .68rem; color: var(--text-muted); letter-spacing: .06em;
}
.budget-amounts {
  font-family: 'DM Mono', monospace;
  font-size: .72rem; color: var(--text-muted);
}
.budget-amounts em { font-style: normal; color: var(--text); }
.budget-bar { height: 3px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.budget-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s ease; }
.budget-fill.warning { background: #c8a840; }
.budget-fill.danger  { background: var(--expense); }

/* ══ TRANSACTION LIST ══ */
.list-section-label {
  font-family: 'Inter', sans-serif;
  font-size: .62rem; color: var(--text-light);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 16px; margin-bottom: 8px;
}
.tx-list {
  flex: 1; padding: 0 12px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); /* nav + add-bar */
  overflow-y: auto;
}
.tx-group { margin-bottom: 22px; }
.tx-date-row {
  display: flex; align-items: center; gap: 10px;
  padding: 0 4px; margin-bottom: 8px;
}
.tx-date-text {
  font-family: 'DM Mono', monospace;
  font-size: .7rem; color: var(--text-muted); letter-spacing: .04em;
  white-space: nowrap;
}
.tx-date-line { flex: 1; height: 1px; background: var(--border-soft); }
.tx-date-sum {
  font-family: 'DM Mono', monospace;
  font-size: .7rem; color: var(--text-muted); letter-spacing: -.01em;
}

.tx-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 5px;
  cursor: pointer; transition: background .1s;
}
.tx-item:active { background: var(--surface2); }
.tx-icon {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent);
}
.tx-info { flex: 1; min-width: 0; }
.tx-cat {
  font-family: 'Noto Serif TC', serif;
  font-size: .85rem; font-weight: 400;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-note {
  font-family: 'Inter', sans-serif;
  font-size: .68rem; color: var(--text-muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-amount {
  font-family: 'DM Mono', monospace;
  font-size: .9rem; font-weight: 400; flex-shrink: 0; letter-spacing: -.01em;
}
.tx-amount.income  { color: var(--income); }
.tx-amount.expense { color: var(--expense); }

.empty-state { text-align: center; padding: 56px 24px; }
.empty-state .e-icon { font-size: 1.8rem; margin-bottom: 14px; opacity: .4; }
.empty-state p {
  font-family: 'Noto Serif TC', serif;
  font-size: .85rem; color: var(--text-muted); line-height: 1.8;
  font-weight: 300;
}

/* ══ BOTTOM NAV — ＋ 嵌入中間 ══ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: var(--nav-bg);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-end;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 15;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 10px 0 10px; background: none; border: none;
  color: var(--text-light); cursor: pointer; transition: color .15s;
}
.nav-btn .nav-icon { font-size: 1.15rem; line-height: 1; }
.nav-btn .nav-label {
  font-family: 'Inter', sans-serif;
  font-size: .58rem; letter-spacing: .04em; line-height: 1;
}
.nav-btn.active { color: var(--accent); }

/* ＋ 長條按鈕 — 浮在導覽列正上方，全寬易按 */
.add-bar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 398px;
  height: 46px;
  background: var(--accent);
  border: none; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 16;
  box-shadow: 0 3px 16px color-mix(in srgb, var(--accent) 42%, transparent),
              0 1px 4px rgba(0,0,0,.1);
  transition: background .3s, transform .1s, opacity .1s;
}
.add-bar:active { transform: translateX(-50%) scale(.97); opacity: .88; }
.add-bar-plus {
  color: #fff; font-size: 1.5rem; line-height: 1;
  font-weight: 300; font-family: 'Inter', sans-serif;
  user-select: none; pointer-events: none;
}
/* 夜間模式：＋ 用深底 × 明亮跳色，確保對比 */
[data-theme="spring-dark"] .add-bar { background: #d4899a; }
[data-theme="spring-dark"] .add-bar-plus { color: #0e0f18; }
[data-theme="summer-dark"] .add-bar { background: #e8602a; }
[data-theme="summer-dark"] .add-bar-plus { color: #080c18; }
[data-theme="autumn-dark"] .add-bar { background: #e8c870; }
[data-theme="autumn-dark"] .add-bar-plus { color: #0a0804; }
[data-theme="winter-dark"] .add-bar { background: #c0d8f8; }
[data-theme="winter-dark"] .add-bar-plus { color: #060810; }

/* ══ STATS ══ */
.stats-content {
  flex: 1; padding: 16px 12px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 124px);
  overflow-y: auto;
}
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px 16px; margin-bottom: 12px;
}
.chart-title {
  font-family: 'Inter', sans-serif;
  font-size: .65rem; color: var(--text-muted);
  letter-spacing: .1em; text-transform: uppercase; margin-bottom: 16px;
}
.bar-chart { display: flex; gap: 5px; align-items: flex-end; height: 90px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; gap: 2px; }
.bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
.bar.income-bar  { background: var(--income); opacity: .55; }
.bar.expense-bar { background: var(--expense); opacity: .6; }
.bar-label {
  font-family: 'DM Mono', monospace;
  font-size: .52rem; color: var(--text-muted);
}
.chart-legend { display: flex; gap: 14px; margin-bottom: 12px; }
.chart-legend span {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Inter', sans-serif;
  font-size: .65rem; color: var(--text-muted);
}
.chart-legend span i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

.cat-list { display: flex; flex-direction: column; gap: 11px; }
.cat-item { display: flex; align-items: center; gap: 10px; }

/* ══ SETTINGS ══ */

.settings-label {
  font-family: 'Inter', sans-serif;
  font-size: .62rem; color: var(--text-muted);
  letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 8px; padding-left: 4px;
}
.settings-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
}
.settings-row:last-child { border-bottom: none; }
.settings-row-label {
  font-family: 'Noto Serif TC', serif;
  font-size: .88rem; font-weight: 400;
}
.settings-row-value {
  font-family: 'Inter', sans-serif;
  color: var(--text-muted); font-size: .82rem;
}
.budget-input-row { gap: 12px; }
.budget-input-row input {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: .88rem; padding: 7px 10px; width: 120px; text-align: right;
  outline: none;
}
.budget-input-row input:focus { border-color: var(--accent); }

/* 主題選擇器 */
/* 8 張主題預覽卡 */
.theme-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.theme-btn {
  display: flex; flex-direction: column;
  border: 2px solid transparent; border-radius: 13px;
  padding: 0; cursor: pointer; overflow: hidden;
  transition: border-color .18s, transform .1s;
  background: none;
}
.theme-btn.active { border-color: var(--accent); transform: scale(1.02); }
.theme-btn:active  { transform: scale(.97); }

/* 卡片本體 — 顏色全 hardcode，不繼承 CSS 變數 */
.tc {
  width: 100%; border-radius: 11px; overflow: hidden;
  font-family: 'Noto Serif TC', serif;
  box-shadow: 0 1px 6px rgba(0,0,0,.08);
}
/* 卡頭：底色 + 標題行 */
.tc-head {
  padding: 9px 11px 7px;
  display: flex; align-items: center; justify-content: space-between;
}
.tc-season {
  font-size: .78rem; font-weight: 500; letter-spacing: .06em;
}
.tc-mode {
  font-family: 'Inter', sans-serif;
  font-size: .55rem; letter-spacing: .06em; opacity: .7;
}
/* 色帶：accent / income / expense */
.tc-band { display: flex; height: 5px; }
.tc-band span { flex: 1; }
/* 卡底：surface 色塊 + 文字色示意 */
.tc-body {
  padding: 6px 11px 9px;
  display: flex; align-items: center; justify-content: space-between;
}
.tc-num {
  font-family: 'DM Mono', monospace;
  font-size: .72rem; letter-spacing: -.01em;
}
.tc-dots { display: flex; gap: 4px; }
.tc-dots span { width: 6px; height: 6px; border-radius: 50%; }
.dark-toggle-row { cursor: pointer; }

/* ══ SHEET OVERLAY ══ */
.sheet-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 30;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.sheet-overlay.open { display: flex; }
.sheet {
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  width: 100%; max-width: 430px;
  padding: 0 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-height: 92dvh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,0,.2,1);
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 32px; height: 3px; background: var(--border); border-radius: 99px; margin: 12px auto 4px; }
.sheet-title {
  font-family: 'Noto Serif TC', serif;
  font-size: .95rem; font-weight: 400; letter-spacing: .04em;
  text-align: center; margin-bottom: 20px; padding-top: 4px;
  color: var(--text);
}

/* 支出 / 收入 toggle */
.type-toggle {
  display: flex; background: var(--surface2);
  border-radius: 10px; padding: 3px; margin-bottom: 20px;
  border: 1px solid var(--border-soft);
}
.type-btn {
  flex: 1; padding: 9px; border: none; border-radius: 8px;
  font-family: 'Noto Serif TC', serif;
  font-size: .85rem; font-weight: 400; cursor: pointer;
  background: none; color: var(--text-muted); transition: all .15s;
  letter-spacing: .04em;
}
.type-btn.active.expense { background: var(--expense); color: #fff; }
.type-btn.active.income  { background: var(--income);  color: #fff; }

/* 金額 */
.field-label {
  font-family: 'Inter', sans-serif;
  font-size: .65rem; color: var(--text-muted);
  letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 7px;
}
.amount-field {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 18px;
  transition: border-color .15s;
}
.amount-field:focus-within { border-color: var(--accent); }
.currency {
  font-family: 'DM Mono', monospace;
  font-size: .9rem; color: var(--text-muted); flex-shrink: 0;
}
.amount-field input {
  flex: 1; background: none; border: none;
  font-family: 'DM Mono', monospace;
  font-size: 1.6rem; font-weight: 300; letter-spacing: -.02em;
  color: var(--text); outline: none; width: 100%;
}

/* 類別 */
.cat-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 18px;
}
.cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--surface2); border: 1.5px solid transparent;
  border-radius: 10px; padding: 10px 4px; cursor: pointer; transition: all .12s;
}
.cat-btn .icon { width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--accent); }
.cat-btn .name {
  font-family: 'Noto Serif TC', serif;
  font-size: .6rem; color: var(--text-muted); text-align: center;
  font-weight: 400;
}
.cat-btn.selected { border-color: var(--accent); background: var(--accent-dim); }
.cat-btn.selected .name { color: var(--text); }

.note-field, .date-field {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 14px;
  font-family: 'Noto Serif TC', serif;
  font-size: .88rem; font-weight: 300;
  color: var(--text); width: 100%; outline: none; margin-bottom: 14px;
  -webkit-appearance: none; color-scheme: inherit;
  transition: border-color .15s;
}
.date-field { font-family: 'DM Mono', monospace; font-size: .85rem; }
.note-field::placeholder { color: var(--text-light); }
.note-field:focus, .date-field:focus { border-color: var(--accent); }

.submit-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: #fff; border: none;
  border-radius: 12px;
  font-family: 'Noto Serif TC', serif;
  font-size: .92rem; font-weight: 400; letter-spacing: .06em;
  cursor: pointer; transition: opacity .12s;
  margin-top: 4px;
}
.submit-btn:active { opacity: .8; }

/* ══ 固定收支 toggle row ══ */
.recur-toggle-row {
  display: flex; align-items: center;
  padding: 14px 0 10px; margin-bottom: 4px;
  border-top: 1px solid var(--border-soft);
}
.recur-toggle-label {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; cursor: pointer; gap: 12px;
  font-family: 'Noto Serif TC', serif;
  font-size: .88rem; color: var(--text-muted);
  user-select: none;
}
.recur-toggle-switch input { display: none; }
.toggle-track {
  display: inline-flex; align-items: center;
  width: 40px; height: 24px; background: var(--border);
  border-radius: 99px; transition: background .2s; flex-shrink: 0;
  position: relative;
}
.toggle-thumb {
  position: absolute; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.2);
  transition: transform .2s;
}
#recur-check:checked ~ .toggle-track { background: var(--accent); }
#recur-check:checked ~ .toggle-track .toggle-thumb { transform: translateX(16px); }
.recur-toggle-label.active { color: var(--accent); }

/* 固定收支展開面板 */
.recur-panel {
  overflow: hidden; max-height: 0;
  transition: max-height .3s ease, opacity .2s;
  opacity: 0;
}
.recur-panel.open { max-height: 500px; opacity: 1; }

/* ══ RECURRING items in list ══ */
.tx-item.recurring-item {
  border-style: dashed; opacity: .82;
}
.tx-item.recurring-item .tx-cat::after {
  content: ' ↻';
  font-size: .7rem; color: var(--text-muted); margin-left: 3px;
}
.tx-item.recurring-done {
  opacity: .45;
}
.tx-item.recurring-done .tx-amount { text-decoration: line-through; }
.recur-badge {
  font-family: 'Inter', sans-serif;
  font-size: .58rem; color: var(--text-muted);
  background: var(--surface2); border: 1px solid var(--border-soft);
  border-radius: 4px; padding: 1px 5px; margin-left: 5px;
  vertical-align: middle; white-space: nowrap;
}

/* ══ RECURRING SHEET extra fields ══ */
.freq-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 14px;
}
.freq-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--surface2); border: 1.5px solid transparent;
  border-radius: 9px; padding: 9px 4px; cursor: pointer; transition: all .12s;
  font-family: 'Noto Serif TC', serif; font-size: .72rem; color: var(--text-muted);
}
.freq-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
.freq-icon { font-size: 1rem; }

.weekday-grid {
  display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap;
}
.wd-btn {
  flex: 1; min-width: 36px; padding: 7px 2px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--surface2); cursor: pointer; transition: all .12s;
  font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--text-muted); text-align: center;
}
.wd-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

.monthday-row {
  display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 14px;
}
.md-btn {
  padding: 6px 2px; border: 1px solid var(--border-soft); border-radius: 6px;
  background: var(--surface2); cursor: pointer; transition: all .12s;
  font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--text-muted); text-align: center;
}
.md-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

.date-range-row { display: flex; gap: 8px; margin-bottom: 14px; }
.date-range-row .date-field { flex: 1; margin-bottom: 0; font-size: .78rem; }
.date-range-sep {
  font-family: 'Inter', sans-serif; font-size: .75rem;
  color: var(--text-muted); align-self: center; flex-shrink: 0;
}

.section-collapsed { display: none; }
.recur-manage-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 10px;
}
.recur-manage-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
}
.recur-manage-row:last-child { border-bottom: none; }
.recur-manage-icon { width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0; }
.recur-manage-info { flex: 1; min-width: 0; }
.recur-manage-name {
  font-family: 'Noto Serif TC', serif; font-size: .85rem; color: var(--text);
}
.recur-manage-desc {
  font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--text-muted); margin-top: 1px;
}
.recur-manage-del {
  background: none; border: none; color: var(--text-muted);
  font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  flex-shrink: 0;
}
.recur-manage-del:active { color: var(--expense); background: var(--surface2); }

/* ══ DETAIL SHEET ══ */
.detail-sheet {
  background: var(--surface); border-radius: 22px 22px 0 0;
  width: 100%; max-width: 430px;
  padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 24px);

}

  letter-spacing: -.03em; margin-bottom: 4px;
}
.detail-date {
  font-family: 'DM Mono', monospace;
  text-align: center; font-size: .75rem;
  color: var(--text-muted); margin-bottom: 24px;
  letter-spacing: .04em;
}
.detail-note-box {
  background: var(--surface2); border-radius: 10px;

  font-family: 'Noto Serif TC', serif;
  font-size: .85rem; color: var(--text-muted); font-weight: 300;
  min-height: 44px;
}
.delete-btn {
  width: 100%; padding: 13px;
  background: transparent;
  color: var(--expense);

  border-radius: 12px;
  font-family: 'Noto Serif TC', serif;
  font-size: .88rem; font-weight: 400; letter-spacing: .04em;
  cursor: pointer; transition: background .12s;
}
.delete-btn:active { background: color-mix(in srgb, var(--expense) 10%, transparent); }

<script>
// ════════════ Data ════════════
const STORAGE_KEY  = 'budget_app_v1';

// SVG icon paths — single-colour, theme-aware (filled with currentColor)
const CAT_SVGS = {

  shop:      '<path d="M6 2L3 6v14h18V6l-3-4H6zm3 9a3 3 0 006 0" fill="currentColor"/>',
  entertain: '<path d="M8 5v14l11-7L8 5z" fill="currentColor"/>',
  health:    '<path d="M12 21C12 21 4 13.5 4 8.5a5 5 0 0110 0 5 5 0 0110 0C24 13.5 12 21 12 21z" fill="currentColor"/>',
  home:      '<path d="M3 12L12 3l9 9v9H3V12z" fill="currentColor"/>',
  edu:       '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  other_e:   '<circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 8v4m0 4h.01" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/>',
  salary:    '<rect x="3" y="6" width="18" height="13" rx="2" fill="currentColor"/><path d="M8 6V4a2 2 0 014 0v2" fill="none" stroke="var(--surface)" stroke-width="1.5"/>',
  freelance: '<rect x="4" y="4" width="16" height="12" rx="2" fill="currentColor"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  invest:    '<polyline points="3,18 9,12 13,16 21,7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  gift:      '<rect x="3" y="10" width="18" height="11" rx="1" fill="currentColor"/><path d="M12 10V21M3 15h18M12 10c0-3 3-6 6-3s0 3 0 3H12zm0 0c0-3-3-6-6-3s0 3 0 3h6z" stroke="var(--surface)" stroke-width="1.2" fill="none"/>',
  other_i:   '<circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 8v8M8 12h8" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/>',
};

function makeSvg(iconId, size=18) {
  const path = CAT_SVGS[iconId] || CAT_SVGS['other_e'];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${path}</svg>`;
}

const CUSTOM_CAT_KEY = 'budget_app_custom_cats';
function loadCustomCats() { try { return JSON.parse(localStorage.getItem(CUSTOM_CAT_KEY)) || {expense:[],income:[]}; } catch { return {expense:[],income:[]}; } }
function saveCustomCats(c) { localStorage.setItem(CUSTOM_CAT_KEY, JSON.stringify(c)); }
let customCats = loadCustomCats();

const BASE_CATEGORIES = {
  expense: [
    { id:'food',      name:'餐飲', svgId:'food' },
    { id:'transport', name:'交通', svgId:'transport' },
    { id:'shop',      name:'購物', svgId:'shop' },
    { id:'entertain', name:'娛樂', svgId:'entertain' },
    { id:'health',    name:'醫療', svgId:'health' },
    { id:'home',      name:'居家', svgId:'home' },
    { id:'edu',       name:'教育', svgId:'edu' },
    { id:'other_e',   name:'其他', svgId:'other_e' },
  ],
  income: [
    { id:'salary',    name:'薪資', svgId:'salary' },
    { id:'freelance', name:'外快', svgId:'freelance' },
    { id:'invest',    name:'投資', svgId:'invest' },
    { id:'gift',      name:'紅包', svgId:'gift' },
    { id:'other_i',   name:'其他', svgId:'other_i' },
  ]
};

function getAllCats(type) {
  return [...BASE_CATEGORIES[type], ...(customCats[type]||[])];
}

// Compatibility: getCat works for both base and custom
const CATEGORIES = BASE_CATEGORIES; // keep for stats compat

function loadData()    { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveData(d)   { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function loadRecur()   { try { return JSON.parse(localStorage.getItem(RECUR_KEY)) || []; } catch { return []; } }
function saveRecur(r)  { localStorage.setItem(RECUR_KEY, JSON.stringify(r)); }
function loadBudget()  { return parseFloat(localStorage.getItem(BUDGET_KEY)) || 0; }
function saveBudget(v) { localStorage.setItem(BUDGET_KEY, v); }

let data   = loadData();
let recurs = loadRecur();   // [{id,type,cat,amount,freq,weekdays,monthday,start,end,note}]
let budget = loadBudget();

// ════════════ Theme ════════════
const THEMES = ['spring','summer','autumn','winter'];
let currentTheme = localStorage.getItem(THEME_KEY) || 'spring';
let isDark = localStorage.getItem(DARK_KEY) === '1';

function applyTheme() {
  const t = isDark ? currentTheme + '-dark' : currentTheme;
  document.body.dataset.theme = t;
  document.getElementById('dark-label').textContent = isDark ? '開' : '關';
  const surface = getComputedStyle(document.body).getPropertyValue('--header-bg').trim();
  document.getElementById('theme-color-meta').content = surface || '#f7f3ee';
  // show only the relevant group; highlight active season
  document.querySelectorAll('.theme-btn').forEach(b => {
    const isMyGroup = b.dataset.group === (isDark ? 'dark' : 'light');
    b.style.display = isMyGroup ? '' : 'none';
    b.classList.toggle('active', isMyGroup && b.dataset.theme === currentTheme);
  });
  localStorage.setItem(THEME_KEY, currentTheme);
  localStorage.setItem(DARK_KEY, isDark ? '1' : '0');
}
applyTheme();

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTheme = btn.dataset.theme;
    isDark = btn.dataset.group === 'dark';
    applyTheme();
  });
});
document.getElementById('dark-toggle').addEventListener('click', () => { isDark = !isDark; applyTheme(); });

// ════════════ State ════════════
const now = new Date();
let viewMonth  = { year: now.getFullYear(), month: now.getMonth() };
let statsMonth = { year: now.getFullYear(), month: now.getMonth() };
let addType    = 'expense';
let selectedCat= null;
let detailId   = null;

// ════════════ Helpers ════════════
function fmt(n) {
  return 'NT$' + Math.abs(n).toLocaleString('zh-TW', { minimumFractionDigits:0, maximumFractionDigits:0 });
}
function monthKey(y,m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function getMonthTx(y,m) { return data.filter(tx => tx.date.startsWith(monthKey(y,m))); }
function getCat(type,id) { return getAllCats(type).find(c=>c.id===id) || { name:id, svgId:'other_e', color:'#808080' }; }
function formatDate(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日　${'日一二三四五六'[d.getDay()]}`;
}
function groupByDate(txs) {
  const g = {};
  txs.forEach(tx => { (g[tx.date] = g[tx.date] || []).push(tx); });
  return Object.entries(g).sort((a,b) => b[0].localeCompare(a[0]));
}

// ════════════ Recurring helpers ════════════
// Return all dates in a given year/month that a recur rule fires
function recurDatesInMonth(r, year, month) {
  const results = [];
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startBound = r.start ? new Date(r.start + 'T00:00:00') : null;
  const endBound   = r.end   ? new Date(r.end   + 'T00:00:00') : null;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    if (startBound && date < startBound) continue;
    if (endBound   && date > endBound)   continue;

    let fires = false;
    if (r.freq === 'daily') {
      fires = true;
    } else if (r.freq === 'weekly') {
      fires = (r.weekdays || []).includes(date.getDay());
    } else if (r.freq === 'monthly') {
      fires = (r.monthday === d);
    }
    if (fires) results.push(`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return results;
}

function freqLabel(r) {
  if (r.freq === 'daily')   return '每天';
  if (r.freq === 'monthly') return `每月${r.monthday}號`;
  const wdNames = '日一二三四五六';
  if (r.freq === 'weekly') {
    const days = (r.weekdays||[]).map(w=>wdNames[w]).join('、');
    return `每週${days}`;
  }
  return '';
}

// ════════════ Render Home ════════════
function renderHome() {
  const {year, month} = viewMonth;
  document.getElementById('month-label').textContent = `${year}.${String(month+1).padStart(2,'0')}`;

  const txs = getMonthTx(year, month);

  // Build recurring virtual entries for this month
  const recurEntries = []; // {date, r, fired:bool}
  recurs.forEach(r => {
    const dates = recurDatesInMonth(r, year, month);
    dates.forEach(date => {
      // Check if already manually confirmed (stored as real tx with recurId)
      const confirmed = data.find(t => t.recurId === r.id && t.date === date);
      recurEntries.push({ date, r, confirmed: !!confirmed });
    });
  });

  // Totals: real txs + confirmed recurring (not double-counted, confirmed are already in data)
  const income  = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount, 0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount, 0);
  // Also count un-confirmed recurring as "expected" in balance (dimmed)
  const recurPending = recurEntries.filter(e=>!e.confirmed);
  const recurIncome  = recurPending.filter(e=>e.r.type==='income').reduce((s,e)=>s+e.r.amount, 0);
  const recurExpense = recurPending.filter(e=>e.r.type==='expense').reduce((s,e)=>s+e.r.amount, 0);
  const balance = (income + recurIncome) - (expense + recurExpense);

  const balEl = document.getElementById('balance');
  const sign  = balance > 0 ? '+' : balance < 0 ? '−' : '';
  balEl.innerHTML = `<span class="num">${sign}${fmt(balance).replace('NT$','NT$\u200b')}</span>`;
  balEl.className = 'balance-amount ' + (balance > 0 ? 'positive' : balance < 0 ? 'negative' : 'zero');
  document.getElementById('total-income').textContent  = fmt(income + recurIncome);
  document.getElementById('total-expense').textContent = fmt(expense + recurExpense);

  // Budget
  const budSec = document.getElementById('budget-section');
  if (budget > 0) {
    budSec.style.display = 'block';
    const totalExp = expense + recurExpense;
    const pct  = Math.min(totalExp / budget, 1);
    const fill = document.getElementById('budget-fill');
    fill.style.width = (pct * 100) + '%';
    fill.className   = 'budget-fill' + (pct >= 1 ? ' danger' : pct >= .8 ? ' warning' : '');
    document.getElementById('budget-text').innerHTML = `<em>${fmt(totalExp)}</em> / ${fmt(budget)}`;
  } else {
    budSec.style.display = 'none';
  }

  // Merge real txs + recurring entries into date groups
  const listEl = document.getElementById('tx-list');
  const allByDate = {};
  txs.filter(t => !t.recurId).forEach(t => {  // real one-time txs
    (allByDate[t.date] = allByDate[t.date] || []).push({ kind:'tx', tx: t });
  });
  recurEntries.forEach(e => {  // recurring (pending or confirmed)
    if (!e.confirmed)
      (allByDate[e.date] = allByDate[e.date] || []).push({ kind:'recur', e });
    // confirmed ones already appear via real txs with recurId
  });
  txs.filter(t => t.recurId).forEach(t => {  // confirmed recurring
    (allByDate[t.date] = allByDate[t.date] || []).push({ kind:'tx', tx: t, isRecurConfirmed: true });
  });

  const groups = Object.entries(allByDate).sort((a,b) => b[0].localeCompare(a[0]));

  if (!groups.length) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="e-icon">⌘</div>
      <p>本月尚無記錄<br>點下方 ＋ 開始記帳</p>
    </div>`; return;
  }

  listEl.innerHTML = groups.map(([date, items]) => {
    const daySum = items.reduce((s,it) => {
      const amt = it.kind==='tx' ? it.tx.amount : it.e.r.amount;
      const typ = it.kind==='tx' ? it.tx.type   : it.e.r.type;
      return s + (typ==='expense' ? -amt : amt);
    }, 0);
    const sumStr = (daySum > 0 ? '+' : daySum < 0 ? '−' : '') + fmt(Math.abs(daySum));

    const rows = items.map(it => {
      if (it.kind === 'tx') {
        const tx   = it.tx;
        const cat  = getCat(tx.type, tx.cat);
        const sign = tx.type==='income' ? '+' : '−';
        const badge= tx.recurId ? `<span class="recur-badge">↻</span>` : '';
        return `<div class="tx-item${tx.recurId?' recurring-done':''}" data-id="${tx.id}">
          <div class="tx-icon">${makeSvg(cat.svgId||'other_e')}</div>
          <div class="tx-info">
            <div class="tx-cat">${cat.name}${badge}</div>
            ${tx.note ? `<div class="tx-note">${tx.note}</div>` : ''}
          </div>
          <div class="tx-amount ${tx.type}">${sign}${fmt(tx.amount)}</div>
        </div>`;
      } else {
        // pending recurring
        const r   = it.e.r;
        const cat = getCat(r.type, r.cat);
        const sign= r.type==='income' ? '+' : '−';
        return `<div class="tx-item recurring-item" data-recur-id="${r.id}" data-recur-date="${date}">
          <div class="tx-icon" style="opacity:.6">${makeSvg(cat.svgId||'other_e')}</div>
          <div class="tx-info">
            <div class="tx-cat">${cat.name}</div>
            <div class="tx-note">${freqLabel(r)}${r.note ? ' · ' + r.note : ''}</div>
          </div>
          <div class="tx-amount ${r.type}" style="opacity:.7">${sign}${fmt(r.amount)}</div>
        </div>`;
      }
    }).join('');

    return `<div class="tx-group">
      <div class="tx-date-row">
        <span class="tx-date-text">${formatDate(date)}</span>
        <span class="tx-date-line"></span>
        <span class="tx-date-sum">${sumStr}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');

  // Real tx clicks → detail
  listEl.querySelectorAll('.tx-item[data-id]').forEach(el =>
    el.addEventListener('click', () => openDetail(el.dataset.id))
  );
  // Recurring pending clicks → confirm or skip
  listEl.querySelectorAll('.tx-item[data-recur-id]').forEach(el =>
    el.addEventListener('click', () => confirmRecurring(el.dataset.recurId, el.dataset.recurDate))
  );
}

// ════════════ Render Stats ════════════
function renderStats() {
  const {year, month} = statsMonth;
  document.getElementById('stats-month-label').textContent = `${year}.${String(month+1).padStart(2,'0')}`;

  const txs     = getMonthTx(year, month);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount, 0);

  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(year, month - i, 1);
    const m = getMonthTx(d.getFullYear(), d.getMonth());
    months.push({
      label:   `${d.getMonth()+1}月`,
      income:  m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),
      expense: m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),
    });
  }
  const maxVal = Math.max(...months.flatMap(m=>[m.income,m.expense]), 1);
  const bars = months.map(m => {
    const iH = Math.round(m.income  / maxVal * 76);
    const eH = Math.round(m.expense / maxVal * 76);
    return `<div class="bar-col">
      <div class="bar-wrap">
        <div class="bar income-bar"  style="height:${iH}px"></div>
        <div class="bar expense-bar" style="height:${eH}px"></div>
      </div>
      <div class="bar-label">${m.label}</div>
    </div>`;
  }).join('');

  const catTotals = {};
  txs.filter(t=>t.type==='expense').forEach(t => { catTotals[t.cat] = (catTotals[t.cat]||0)+t.amount; });
  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catRows = sorted.length === 0
    ? `<div style="font-family:'Noto Serif TC',serif;font-size:.82rem;color:var(--text-muted);text-align:center;padding:8px 0;font-weight:300">本月無支出記錄</div>`
    : sorted.map(([id,amt]) => {
        const cat = getCat('expense', id);
        const pct = expense > 0 ? Math.round(amt/expense*100) : 0;
        return `<div class="cat-item">
          <div class="cat-icon" style="color:var(--accent)">${makeSvg(cat.svgId||'other_e',18)}</div>
          <div class="cat-info">
            <div class="cat-name">${cat.name}<span class="cat-pct">${pct}%</span></div>
            <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
          </div>
          <div class="cat-amount">−${fmt(amt)}</div>
        </div>`;
      }).join('');

  document.getElementById('stats-content').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">近六個月收支</div>
      <div class="chart-legend">
        <span><i style="background:var(--income);opacity:.55"></i>收入</span>
        <span><i style="background:var(--expense);opacity:.6"></i>支出</span>
      </div>
      <div class="bar-chart">${bars}</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">支出分類</div>
      <div class="cat-list">${catRows}</div>
    </div>`;
}

// ════════════ Add bar → open sheet directly ════════════
document.getElementById('add-bar-btn').addEventListener('click', openAdd);

// ════════════ Unified Add Sheet ════════════
let rFreq = 'daily', rWeekdays = [], rMonthday = 1;

// Build monthday picker 1–31
(function() {
  const g = document.getElementById('r-monthday-grid');
  g.innerHTML = Array.from({length:31},(_,i)=>i+1).map(d =>
    `<button class="md-btn${d===1?' selected':''}" data-d="${d}">${d}</button>`
  ).join('');
  g.querySelectorAll('.md-btn').forEach(b => b.addEventListener('click', () => {
    rMonthday = parseInt(b.dataset.d);
    g.querySelectorAll('.md-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  }));
})();

function openAdd() {
  addType = 'expense'; selectedCat = null;
  document.getElementById('amount-input').value = '';
  document.getElementById('note-input').value   = '';
  document.getElementById('date-input').value   = new Date().toISOString().split('T')[0];
  // reset recur
  document.getElementById('recur-check').checked = false;
  document.getElementById('recur-panel').classList.remove('open');
  document.querySelector('.recur-toggle-label').classList.remove('active');
  rFreq = 'daily'; rWeekdays = []; rMonthday = 1;
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('selected', b.dataset.freq==='daily'));
  document.querySelectorAll('.wd-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.md-btn').forEach((b,i) => b.classList.toggle('selected', i===0));
  document.getElementById('r-start').value = new Date().toISOString().split('T')[0];
  document.getElementById('r-end').value   = '';
  updateFreqSections();
  // type buttons
  document.querySelectorAll('.type-btn[data-type]').forEach(b =>
    b.classList.toggle('active', b.dataset.type === 'expense'));
  renderCatGrid();
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(() => document.getElementById('amount-input').focus(), 320);
}
function closeAdd() { document.getElementById('add-overlay').classList.remove('open'); }

function updateFreqSections() {
  document.getElementById('r-weekday-section').classList.toggle('section-collapsed',
    rFreq !== 'weekly');
  document.getElementById('r-monthday-section').classList.toggle('section-collapsed',
    rFreq !== 'monthly');
}

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  const cats = getAllCats(addType);
  grid.innerHTML = cats.map(c => `
    <button class="cat-btn${selectedCat===c.id?' selected':''}" data-id="${c.id}">
      <span class="icon">${makeSvg(c.svgId||'other_e')}</span>
      <span class="name">${c.name}</span>
    </button>`).join('') +
    `<button class="cat-btn cat-add-btn" id="cat-add-btn">
      <span class="icon" style="color:var(--text-muted)">
        <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      <span class="name" style="color:var(--text-muted)">新增</span>
    </button>`;
  grid.querySelectorAll('.cat-btn:not(.cat-add-btn)').forEach(btn =>
    btn.addEventListener('click', () => { selectedCat = btn.dataset.id; renderCatGrid(); })
  );
  const addBtn = document.getElementById('cat-add-btn');
  if (addBtn) addBtn.addEventListener('click', () => openCustomCat(addType));
}

function openCustomCat(type) {
  const name = prompt('新類別名稱（最多5字）：');
  if (!name || !name.trim()) return;
  const trimmed = name.trim().slice(0, 5);
  const id = 'custom_' + Date.now();
  customCats[type] = customCats[type] || [];
  customCats[type].push({ id, name: trimmed, svgId: type==='income'?'other_i':'other_e' });
  saveCustomCats(customCats);
  selectedCat = id;
  renderCatGrid();
}

document.getElementById('add-overlay').addEventListener('click', e => {
  if (e.target===e.currentTarget) closeAdd();
});

// type toggle
document.querySelectorAll('.type-btn[data-type]').forEach(btn =>
  btn.addEventListener('click', () => {
    addType = btn.dataset.type; selectedCat = null;
    document.querySelectorAll('.type-btn[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCatGrid();
  })
);

// recur toggle switch
document.getElementById('recur-check').addEventListener('change', function() {
  document.getElementById('recur-panel').classList.toggle('open', this.checked);
  document.querySelector('.recur-toggle-label').classList.toggle('active', this.checked);
});

// freq buttons
document.querySelectorAll('.freq-btn').forEach(btn =>
  btn.addEventListener('click', () => {
    rFreq = btn.dataset.freq; rWeekdays = [];
    document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.querySelectorAll('.wd-btn').forEach(b => b.classList.remove('selected'));
    updateFreqSections();
  })
);
document.querySelectorAll('.wd-btn').forEach(btn =>
  btn.addEventListener('click', () => {
    const wd = parseInt(btn.dataset.wd);
    if (rWeekdays.includes(wd)) rWeekdays = rWeekdays.filter(w=>w!==wd);
    else rWeekdays.push(wd);
    btn.classList.toggle('selected', rWeekdays.includes(wd));
  })
);

// submit
document.getElementById('submit-btn').addEventListener('click', () => {
  const amount   = parseFloat(document.getElementById('amount-input').value);
  const date     = document.getElementById('date-input').value;
  const note     = document.getElementById('note-input').value.trim();
  const isRecur  = document.getElementById('recur-check').checked;

  if (!amount || amount <= 0) { document.getElementById('amount-input').focus(); return; }
  if (!selectedCat) {
    document.getElementById('cat-grid').style.outline = '2px solid var(--accent)';
    setTimeout(() => document.getElementById('cat-grid').style.outline='', 600); return;
  }
  if (!date) return;

  if (isRecur) {
    // validate weekdays if needed
    if (rFreq === 'weekly' && rWeekdays.length === 0) {
      document.getElementById('r-weekday-section').style.outline = '2px solid var(--accent)';
      setTimeout(() => document.getElementById('r-weekday-section').style.outline='', 600); return;
    }
    const start = document.getElementById('r-start').value || date;
    const end   = document.getElementById('r-end').value   || null;
    recurs.push({
      id: Date.now().toString(),
      type: addType, cat: selectedCat, amount,
      freq: rFreq, weekdays: rWeekdays.slice(), monthday: rMonthday,
      start, end, note
    });
    saveRecur(recurs);
  } else {
    data.push({ id: Date.now().toString(), type: addType, amount, cat: selectedCat, date, note });
    saveData(data);
  }
  closeAdd();
  renderHome();
  if (document.getElementById('view-stats').classList.contains('active')) renderStats();
});

// ════════════ Confirm pending recurring item ════════════
function confirmRecurring(recurId, date) {
  const r = recurs.find(r=>r.id===recurId); if (!r) return;
  const cat = getCat(r.type, r.cat);
  const sign = r.type==='income' ? '+' : '−';
  if (!confirm(`確認記帳？\n${cat.icon} ${cat.name}  ${sign}${fmt(r.amount)}\n${formatDate(date)}`)) return;
  data.push({ id: Date.now().toString(), type: r.type, amount: r.amount,
              cat: r.cat, date, note: r.note, recurId: r.id });
  saveData(data);
  renderHome();
}

// ════════════ Detail Sheet ════════════
function openDetail(id) {
  const tx = data.find(t=>t.id===id); if (!tx) return;
  detailId = id;
  const cat  = getCat(tx.type, tx.cat);
  const sign = tx.type==='income' ? '+' : '−';
  document.getElementById('detail-icon').innerHTML = makeSvg(cat.svgId||'other_e', 28);
  document.getElementById('detail-icon').style.background = 'color-mix(in srgb, var(--accent) 12%, transparent)';
  document.getElementById('detail-cat').textContent    = cat.name;
  document.getElementById('detail-amount').textContent = sign + fmt(tx.amount);
  document.getElementById('detail-amount').style.color = tx.type==='income' ? 'var(--income)' : 'var(--expense)';
  document.getElementById('detail-date').textContent   = formatDate(tx.date);
  document.getElementById('detail-note').textContent   = tx.note || '無備註';
  document.getElementById('detail-overlay').classList.add('open');
}
document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target===e.currentTarget) document.getElementById('detail-overlay').classList.remove('open');
});
document.getElementById('delete-btn').addEventListener('click', () => {
  if (!confirm('確定刪除這筆記錄？')) return;
  data = data.filter(t=>t.id!==detailId);
  saveData(data);
  document.getElementById('detail-overlay').classList.remove('open');
  renderHome();
  if (document.getElementById('view-stats').classList.contains('active')) renderStats();
});

// ════════════ Recurring management (in settings) ════════════
function renderRecurManage() {
  const list  = document.getElementById('recur-manage-list');
  const empty = document.getElementById('recur-empty');
  if (!recurs.length) { list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  list.innerHTML = `<div class="recur-manage-card">` +
    recurs.map(r => {
      const cat = getCat(r.type, r.cat);
      const sign= r.type==='income' ? '+' : '−';
      const range= r.start ? ` ${r.start}${r.end?' ~ '+r.end:''}` : '';
      return `<div class="recur-manage-row" data-rid="${r.id}">
        <span class="recur-manage-icon">${makeSvg(cat.svgId||'other_e',16)}</span>
        <div class="recur-manage-info">
          <div class="recur-manage-name">${cat.name} <span style="font-family:'DM Mono',monospace;font-size:.78rem">${sign}${fmt(r.amount)}</span></div>
          <div class="recur-manage-desc">${freqLabel(r)}${range}${r.note?' · '+r.note:''}</div>
        </div>
        <button class="recur-manage-del" data-rid="${r.id}">✕</button>
      </div>`;
    }).join('') + `</div>`;
  list.querySelectorAll('.recur-manage-del').forEach(btn =>
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('刪除此固定收支規則？')) return;
      recurs = recurs.filter(r=>r.id!==btn.dataset.rid);
      saveRecur(recurs);
      renderRecurManage();
      renderHome();
    })
  );
}

// ════════════ Navigation ════════════
document.querySelectorAll('.nav-btn[data-view]').forEach(btn =>
  btn.addEventListener('click', () => {
    const target = btn.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + target).classList.add('active');
    btn.classList.add('active');
    // ＋ bar only on home
    document.getElementById('add-bar-btn').style.display = target === 'home' ? '' : 'none';
    if (target === 'stats') renderStats();
    if (target === 'settings') renderRecurManage();
  })
);

// Month nav
const prevMonth = ({year,month}) => month===0 ? {year:year-1,month:11} : {year,month:month-1};
const nextMonth = ({year,month}) => month===11 ? {year:year+1,month:0}  : {year,month:month+1};

document.getElementById('prev-month').addEventListener('click', () => { viewMonth = prevMonth(viewMonth); renderHome(); });
document.getElementById('next-month').addEventListener('click', () => { viewMonth = nextMonth(viewMonth); renderHome(); });
document.getElementById('stats-prev-month').addEventListener('click', () => { statsMonth = prevMonth(statsMonth); renderStats(); });
document.getElementById('stats-next-month').addEventListener('click', () => { statsMonth = nextMonth(statsMonth); renderStats(); });

// ════════════ Settings ════════════
document.getElementById('budget-input').value = budget || '';
document.getElementById('save-budget-btn').addEventListener('click', () => {
  budget = parseFloat(document.getElementById('budget-input').value) || 0;
  saveBudget(budget); renderHome();
  // subtle feedback
  const btn = document.getElementById('save-budget-btn');
  const orig = btn.querySelector('.settings-row-value').textContent;
  btn.querySelector('.settings-row-value').textContent = '✓';
  setTimeout(() => btn.querySelector('.settings-row-value').textContent = orig, 1200);
});
document.getElementById('export-btn').addEventListener('click', () => {
  if (!data.length) { alert('目前沒有資料可匯出'); return; }
  const rows = [['日期','類型','類別','金額','備註']];
  data.forEach(tx => {
    const cat = getCat(tx.type, tx.cat);
    rows.push([tx.date, tx.type==='income'?'收入':'支出', cat.name, tx.amount, tx.note]);
  });
  const csv  = rows.map(r => r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a    = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download='記帳資料.csv'; a.click();
});
document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('確定要清除所有記錄？此操作無法復原。')) return;
  data = []; saveData(data); renderHome();
});

// ════════════ PWA ════════════
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

renderHome();
</script>
